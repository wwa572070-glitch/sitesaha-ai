services:
  sitesaha:
    build: .
    container_name: sitesaha-ai
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8501"
      SITESHAHA_HOST: "0.0.0.0"
    ports:
      - "8501:8501"
    volumes:
      - sitesaha-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sitesaha-data:
